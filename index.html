    <!-- Browser chrome. Two theme-colors so the address bar matches the
         viewer's mode instead of forcing the dark brand green on both. -->
    <meta name="theme-color" content="#F2EDE4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1B3A2D" media="(prefers-color-scheme: dark)">
    <meta name="msapplication-TileColor" content="#1B3A2D">
    <meta name="application-name" content="Madras Mami">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Let mobile Safari linkify the phone number in the crawlable block. -->
    <meta name="format-detection" content="telephone=yes, address=yes">

    <!-- Identity links. rel="me" is how several crawlers confirm that these
         profiles and this domain are the same business. -->
    <link rel="me" href="https://www.instagram.com/madrasmami.ca/">
    <link rel="me" href="https://www.facebook.com/madrasmami">
    <link rel="me" href="mailto:hello@madrasmami.ca">
    <link rel="me" href="tel:+19059135900">

    <!-- Ordering and booking both hand off to Toast; warm the connection so the
         two highest-intent clicks on the site do not pay full DNS+TLS cost. -->
    <link rel="preconnect" href="https://order.toasttab.com" crossorigin>
    <link rel="dns-prefetch" href="https://order.toasttab.com">
    <link rel="preconnect" href="https://tables.toasttab.com" crossorigin>
